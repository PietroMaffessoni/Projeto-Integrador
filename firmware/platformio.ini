; Firmware do controlador de vagas — ESP32 DevKit v1
;
;   pio run                 compila
;   pio run -t upload       grava na placa
;   pio device monitor      abre o monitor serial (115200)

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.0
    adafruit/Adafruit NeoPixel@^1.12.3

build_flags =
    -D VERSAO_FIRMWARE=\"1.0.0\"
    ; Descomente para ver as leituras cruas dos 16 canais no serial, sem
    ; publicar nada — é o modo usado na calibração (docs/calibracao-sensores.md).
    ; -D MODO_CALIBRACAO=1
