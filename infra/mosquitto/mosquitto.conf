# Broker de desenvolvimento e demonstração.
#
# Sem autenticação de propósito: a rede é um roteador próprio isolado, montado
# só para a apresentação (ver docs/roteiro-demonstracao.md). Numa instalação
# real no campus, trocar por autenticação por usuário/senha e TLS na 8883.

listener 1883 0.0.0.0
allow_anonymous true

# Mensagens retained precisam sobreviver a um restart do broker: é o que garante
# que o backend, ao reconectar, receba o estado atual das 16 vagas sem esperar
# um carrinho se mover (CLAUDE.md, seção 6).
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type notice
log_type warning
log_type error
connection_messages true
